<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Torob Rent product demo</title>
  <desc id="desc">A red Torob Rent demo cover with a laptop marketplace preview and play button.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7f7"/>
      <stop offset="1" stop-color="#f4f5f7"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252a31"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#5b1116" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1280" height="720" rx="34" fill="url(#bg)"/>
  <circle cx="1120" cy="92" r="250" fill="#d72c34" opacity=".07"/>
  <circle cx="76" cy="665" r="190" fill="#d72c34" opacity=".05"/>
  <g transform="translate(80 72)">
    <rect width="58" height="58" rx="17" fill="#d72c34"/>
    <path d="M17 22h24M17 29h18M17 36h12" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="76" y="39" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#20252b">TOROB RENT</text>
  </g>
  <text x="80" y="202" font-family="Arial, sans-serif" font-size="62" font-weight="800" fill="#20252b">Product demo</text>
  <text x="80" y="252" font-family="Arial, sans-serif" font-size="26" fill="#687078">Search · Compare · Request · Handoff · Return</text>
  <g filter="url(#shadow)" transform="translate(80 330)">
    <rect width="1120" height="286" rx="28" fill="#fff" stroke="#e6e8ea"/>
    <rect x="36" y="36" width="430" height="214" rx="18" fill="url(#screen)"/>
    <rect x="58" y="58" width="386" height="170" rx="9" fill="#f8f9fa"/>
    <rect x="78" y="80" width="346" height="34" rx="9" fill="#fff" stroke="#e6e8ea"/>
    <circle cx="400" cy="97" r="11" fill="#d72c34"/>
    <rect x="78" y="134" width="98" height="75" rx="10" fill="#e9ebee"/>
    <rect x="190" y="138" width="145" height="12" rx="6" fill="#343a40"/>
    <rect x="190" y="162" width="110" height="9" rx="4.5" fill="#a0a6ad"/>
    <rect x="190" y="184" width="75" height="18" rx="9" fill="#fff0f0"/>
    <rect x="348" y="181" width="76" height="24" rx="8" fill="#d72c34"/>
    <text x="520" y="94" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#d72c34">5-MINUTE WALKTHROUGH</text>
    <text x="520" y="143" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#20252b">See the full rental flow</text>
    <text x="520" y="185" font-family="Arial, sans-serif" font-size="21" fill="#687078">A guided tour of the renter and owner experience.</text>
    <rect x="520" y="212" width="194" height="42" rx="21" fill="#d72c34"/>
    <circle cx="548" cy="233" r="14" fill="#fff"/>
    <path d="M544 226l10 7-10 7z" fill="#d72c34"/>
    <text x="572" y="240" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">WATCH DEMO</text>
  </g>
