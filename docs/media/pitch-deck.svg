<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Torob Rent pitch deck</title>
  <desc id="desc">A dark presentation cover for the Torob Rent early prototype pitch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242930"/>
      <stop offset="1" stop-color="#111419"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" rx="34" fill="url(#bg)"/>
  <path d="M0 562C244 455 390 610 618 522s375-32 662-180v378H0z" fill="#d72c34" opacity=".1"/>
  <circle cx="1118" cy="118" r="210" fill="none" stroke="#d72c34" stroke-width="60" opacity=".12"/>
  <g transform="translate(80 72)">
    <rect width="58" height="58" rx="17" fill="#d72c34"/>
    <path d="M17 22h24M17 29h18M17 36h12" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="76" y="39" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">TOROB RENT</text>
  </g>
  <text x="80" y="223" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#f06a70">EARLY PROTOTYPE PITCH</text>
  <text x="80" y="305" font-family="Arial, sans-serif" font-size="64" font-weight="800" fill="#fff">Access equipment</text>
  <text x="80" y="378" font-family="Arial, sans-serif" font-size="64" font-weight="800" fill="#fff">for the time you need it.</text>
  <text x="80" y="439" font-family="Arial, sans-serif" font-size="25" fill="#b9bec5">The problem, product thesis, prototype, and path to validation.</text>
  <g filter="url(#shadow)" transform="translate(80 530)">
    <rect width="328" height="82" rx="20" fill="#fff"/>
    <rect x="20" y="18" width="48" height="46" rx="12" fill="#fff0f0"/>
    <path d="M35 31h18v20H35zm3-5h12" fill="none" stroke="#d72c34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#d72c34">GOOGLE SLIDES</text>
    <text x="88" y="59" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#20252b">OPEN THE PITCH DECK →</text>
  </g>
  <text x="1200" y="659" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#7f868f">Independent prototype · 2026</text>
</svg>
