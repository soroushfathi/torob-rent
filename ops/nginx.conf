# Install only this vhost; leave shared nginx.conf and other sites unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name torob-rent.xdo-run.ir;
    client_max_body_size 6m;
    location ^~ /.well-known/acme-challenge/ { root /var/www/torob-rent-acme; }
    location = /api/metrics { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3417;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
